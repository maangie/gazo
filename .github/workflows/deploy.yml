name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイが重なったときは、実行中のものを止めずに後のものを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Node.js 25 以降には Corepack が同梱されていないため、明示的に入れる
      - name: Corepack を有効にする
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: 依存パッケージのインストール
        run: yarn install --immutable

      - uses: actions/configure-pages@v6

      - name: ビルド
        run: yarn build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: デプロイ
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
