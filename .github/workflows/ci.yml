name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: テストとビルド
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Node.js 25 以降には Corepack が同梱されていないため、明示的に入れる
      - name: Corepack を有効にする
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: 依存パッケージのインストール
        run: yarn install --immutable

      - name: テスト
        run: yarn test run

      - name: ビルド
        run: yarn build
